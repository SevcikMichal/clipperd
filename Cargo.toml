[package]
name = "clipperd"
version = "0.1.1"
edition = "2021"
description = "Seamless clipboard sync between iPhone and Linux over local network"
license = "MIT"

[[bin]]
name = "clipperd"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }

# TLS
rcgen = "0.14"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"

# Clipboard (Wayland + X11 auto-detect)
arboard = { version = "3", features = ["wayland-data-control"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Config
serde = { version = "1", features = ["derive"] }
toml = "1"

# Serialization / utils
serde_json = "1"
base64 = "0.22"
rand = "0.9"
hex = "0.4"
blake3 = "1"

# QR code for setup
qrcode = "0.14"

# Image support
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Error handling
anyhow = "1"

# Hostname
hostname = "0.4"

# Date/time (for cert validity)
time = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
tokio-util = { version = "0.7", features = ["io"] }
bytes = "1"

# Network interface detection
local-ip-address = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
